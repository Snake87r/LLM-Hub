name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codice sorgente (con sottomoduli)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura JDK 17 e 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            17
          distribution: 'temurin'
          cache: gradle

      - name: Accetta licenze Android SDK preinstallato
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compila APK Debug
        run: |
          if [ -f "gradlew" ]; then
            echo "DEBUG_PREMIUM=true" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "android/gradlew" ]; then
            cd android
            echo "DEBUG_PREMIUM=true" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "File gradlew non trovato"
            ls -la
            exit 1
          fi


      - name: Carica APK compilato
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Hub-debug-apk
          path: "**/*.apk"
