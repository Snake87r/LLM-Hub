name: Build & Release Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codice sorgente (con sottomoduli)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configura JDK 17 e 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            17
          distribution: 'temurin'
          cache: gradle

      - name: Accetta licenze Android SDK preinstallato
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ripristina Keystore di Firma dai Secret
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Compila APK Debug con funzioni Premium
        run: |
          if [ -f "gradlew" ]; then
            echo "DEBUG_PREMIUM=true" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "android/gradlew" ]; then
            cd android
            echo "DEBUG_PREMIUM=true" >> local.properties
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "File gradlew non trovato"
            ls -la
            exit 1
          fi

      - name: Prepara Tag e Firma File APK Beta
        id: prep
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          BUILD_DATE=$(TZ='Europe/Rome' date +'%Y-%m-%d')
          UPSTREAM_FULL_SHA=$(git ls-remote https://github.com/timmyy123/LLM-Hub.git HEAD | awk '{print $1}')
          UPSTREAM_SHORT_SHA=$(echo "$UPSTREAM_FULL_SHA" | cut -c1-7)

          RELEASE_TAG="beta-${BUILD_DATE}-${UPSTREAM_SHORT_SHA}"
          ORIG_APK=$(find . -type f -name "*.apk" | head -n 1)
          BETA_APK="LLM-Hub-${RELEASE_TAG}.apk"

          # Trova l'ultima versione di apksigner preinstallata nell'SDK Android
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          # Sovrascrive la firma di default di Gradle con il tuo keystore fisso
          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$BETA_APK" \
            "$ORIG_APK"

          # Stampa nei log l'impronta SHA-256 per verificare che sia sempre identica
          echo "=== Impronta Certificato APK ==="
          "$APKSIGNER" verify --print-certs "$BETA_APK"

          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "apk_path=$BETA_APK" >> $GITHUB_OUTPUT
          echo "sha_full=$UPSTREAM_FULL_SHA" >> $GITHUB_OUTPUT
          echo "sha_short=$UPSTREAM_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Pubblica Release Beta su GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "LLM-Hub beta - ${{ steps.prep.outputs.build_date }} (${{ steps.prep.outputs.sha_short }})"
          files: ${{ steps.prep.outputs.apk_path }}
          prerelease: true
          generate_release_notes: false
          body: |
            Build beta compilata dal sorgente con DEBUG_PREMIUM attivo.
            Firmata con keystore persistente tramite apksigner (aggiornabile senza disinstallazione).
            Commit progetto originale: https://github.com/timmyy123/LLM-Hub/commit/${{ steps.prep.outputs.sha_full }}
